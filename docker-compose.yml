services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: haber
      POSTGRES_PASSWORD: haber
      POSTGRES_DB: haber
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haber"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://haber:haber@db:5432/haber
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  dbdata:
